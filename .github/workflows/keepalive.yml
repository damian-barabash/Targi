name: Supabase keep-alive

# Darmowy plan Supabase usypia projekt po 7 dniach bez ruchu w bazie.
# Raz dziennie jedno lekkie zapytanie (ta sama funkcja, której używa build strony).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://srjkshsoeokvnbukmoqg.supabase.co/rest/v1/rpc/published_site" \
            -H "apikey: sb_publishable__HWHQbhS68x68FO35GeDSw_dL-JAfao" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
