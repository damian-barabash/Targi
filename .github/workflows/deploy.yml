name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # strona działa na własnej domenie (public/CNAME) → ścieżki od "/"
      # dla adresu github.io/<repo> ustaw zmienną repo BASE_PATH=/<repo>/
      BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://beauty.barabashflow.pl' }}
      # klucz publishable jest publiczny z założenia (dostęp pilnuje RLS)
      VITE_SUPABASE_URL: https://srjkshsoeokvnbukmoqg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable__HWHQbhS68x68FO35GeDSw_dL-JAfao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
